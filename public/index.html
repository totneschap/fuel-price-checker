<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UK Fuel Price Checker | Compare Petrol, Diesel &amp; EV Charging Prices</title>
  <meta name="description" content="Find the cheapest petrol, diesel and EV charging prices near you. Search by postcode, compare stations on a live map, and check opening hours and amenities instantly." />
  <link rel="canonical" href="https://ukfuelchecker.co.uk/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="UK Fuel Price Checker" />
  <meta property="og:title" content="UK Fuel Price Checker | Compare Petrol, Diesel & EV Charging Prices" />
  <meta property="og:description" content="Find the cheapest petrol, diesel and EV charging prices near you. Search by postcode, compare stations on a live map, and check opening hours and amenities instantly." />
  <meta property="og:url" content="https://ukfuelchecker.co.uk/" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="UK Fuel Price Checker" />
  <meta name="twitter:description" content="Find the cheapest petrol, diesel and EV charging prices near you, with a live map and opening hours." />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-layout">
    <div class="sidebar-top">
      <header class="topbar">
        <h1><span id="mode-emoji">⛽</span> Fuel Price Checker</h1>
        <p id="feed-status" class="feed-status">Loading price feeds…</p>
        <p class="feed-status"><a href="/petrol-prices">Prices by city</a> &middot; <a href="/uk-fuel-prices-live">UK prices live</a> &middot; <a href="/privacy.html">Privacy Policy</a></p>
      </header>

      <div class="mode-tabs" role="tablist">
        <button type="button" class="mode-tab active" id="tab-petrol" data-mode="petrol">⛽ Petrol/Diesel</button>
        <button type="button" class="mode-tab" id="tab-ev" data-mode="ev">🔌 EV Charging</button>
      </div>

      <form id="search-form" class="search-form">
        <div class="field">
          <label for="postcode">Postcode</label>
          <div class="postcode-row">
            <input id="postcode" type="text" placeholder="e.g. SW1A 1AA" autocomplete="postal-code" />
            <button type="button" id="locate-btn" title="Use my current location">📍</button>
          </div>
        </div>

        <div class="field" id="fuel-field">
          <label for="fuel">Fuel</label>
          <select id="fuel">
            <option value="E10">Unleaded (E10)</option>
            <option value="E5">Super Unleaded (E5)</option>
            <option value="B7">Diesel (B7)</option>
            <option value="SDV">Super Diesel (SDV)</option>
            <option value="B10">B10 Diesel</option>
            <option value="HVO">HVO</option>
          </select>
        </div>

        <div class="field" id="connector-field" hidden>
          <label for="connector">Connector</label>
          <select id="connector">
            <option value="">Any</option>
            <option value="CCS">CCS</option>
            <option value="CHAdeMO">CHAdeMO</option>
            <option value="Type 2">Type 2</option>
          </select>
        </div>

        <div class="field">
          <label for="radius">Radius</label>
          <select id="radius">
            <option value="3">3 miles</option>
            <option value="5" selected>5 miles</option>
            <option value="10">10 miles</option>
            <option value="20">20 miles</option>
          </select>
        </div>

        <div class="field">
          <label for="sort">Sort by</label>
          <select id="sort">
            <option value="price">Cheapest first</option>
            <option value="distance">Nearest first</option>
            <option value="power" id="sort-power" hidden>Fastest charger</option>
          </select>
        </div>

        <button type="submit" class="search-btn" id="search-btn">Find fuel prices</button>
      </form>

      <p id="error" class="error" hidden></p>
      <p id="ev-price-note" class="ev-price-note" hidden>Prices shown are typical pay-as-you-go rates for each network, not live per-station prices — always check the charger or app before paying.</p>
    </div>

    <div class="map-panel">
      <div id="map"></div>
    </div>

    <ul id="results" class="results"></ul>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
